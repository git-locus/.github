# Docker Compose for local Locus development.
#
# It uses no Dockerfile and no custom images: only base images plus the mounted source.
# Dependencies are cached in dedicated volumes and skipped on later restarts.
#
# Usage:
#   podman compose up
#   (or docker compose up if you prefer Docker)
#
# Environment variables:
#   Create a .env file from app.env.example before starting.

# Explicit project name: without it the containers would take the name of the
# folder (".github" → "github_*"), invisible as "locus" in Podman Desktop /
# Docker Desktop.
name: locus

services:

  # ---------------------------------------------------------------------------
  # Azurite – emulatore Azure Blob Storage in locale
  # ---------------------------------------------------------------------------
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    # --skipApiVersionCheck: the newest azure-storage-blob SDK uses an API
    # version that stable Azurite does not recognise. Azurite handles it anyway.
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      # Exposed on the host only for debugging (Storage Explorer / curl). The
      # browser no longer uses it: media is reverse-proxied by the API
      # through /api/media/*.
      - "10000:10000"
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Django API – settings_dev (SQLite, DEBUG=True), source mounted.
  # Hot reload is on. The venv is mounted at /opt/venv (outside /app) so the
  # reloader does not scan the volume, which is compatible with rootless Podman.
  # ---------------------------------------------------------------------------
  api:
    # Immagine ufficiale uv+python: niente curl|sh da internet, build deterministica.
    image: ghcr.io/astral-sh/uv:python3.12-alpine
    working_dir: /app
    # Explicit DNS: rootless Podman containers sometimes do not inherit the
    # host resolvers (systemd-resolved). Without these, `uv sync` fails on pypi.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      # Live source: every code change is visible right away
      - ../api/src:/app:z
      # Venv outside /app so the Django reloader does not scan the volume
      # (avoids permission errors on rootless Podman)
      - api_venv:/opt/venv
      # Static files shared with nginx
      - static_files:/static
    environment:
      DJANGO_SETTINGS_MODULE: api.settings_dev
      # Internal hostname to reach Azurite. The browser never reaches Azurite
      # directly: private media is served through
      # `apps.media.views` at /api/media/*.
      AZURITE_HOST: "azurite:10000"
      # ACS (e-mail) is not used in local development; placeholder for imports.
      ACS_CONNECTION_STRING: ${ACS_CONNECTION_STRING:-endpoint=https://fake.communication.azure.com/;accesskey=fake}
      PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
      VIRTUAL_ENV: /opt/venv
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
    # Bootstrap: sync deps (uv is already in the image), init blob, migrate, runserver.
    command: >
      sh -c "
        uv sync --frozen &&
        uv run python scripts/init_blob_containers.py &&
        uv run python manage.py makemigrations account category chat notification post support &&
        uv run python manage.py migrate --no-input &&
        uv run python manage.py collectstatic --no-input &&
        uv run python manage.py runserver 0.0.0.0:8000
      "
    depends_on:
      azurite:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/categories/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # ---------------------------------------------------------------------------
  # Client Next.js – nessuna build, sorgente montato, npm run dev con hot-reload
  # ---------------------------------------------------------------------------
  client:
    # Matches client/.github/workflows/test.yml's actions/setup-node
    # version (26) -- node:20-alpine's jsdom@30/undici@8 combo throws
    # "webidl.util.markAsUncloneable is not a function" under Vitest,
    # and NODE_OPTIONS=--no-webstorage (needed on Node >=25, see
    # client/vitest.config.js) isn't a recognized flag before Node 22.
    image: node:26-alpine
    working_dir: /app
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      # Sorgente live
      - ../client:/app:z
      # node_modules in a separate volume: not overwritten by the host mount
      - client_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    # Install dependencies (skipped if already present), then start the dev server
    command: sh -c "npm install && npm run dev"
    healthcheck:
      # Generous start_period: a cold "npm install" (empty node_modules volume)
      # can take 2-3 minutes before "next dev" is listening; with a tighter
      # window the container is marked unhealthy before the dev server answers.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 240s
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # Nginx – reverse proxy su http://localhost:8080
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - static_files:/static:ro
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_healthy

volumes:
  azurite_data:
  static_files:
  api_venv:
  client_node_modules:
