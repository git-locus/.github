# nginx template – ${DOMAIN} is substituted at runtime by init-https.sh
# through envsubst.
# Do NOT edit nginx.conf directly: it is regenerated on every start
# of the container.

# Each proxied request holds two connections (client side and upstream) and
# HTTP/2 lets one visitor have up to 100 requests in flight, so the budget is
# sized well above nginx's default.
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hides the nginx version in headers and error pages.
    server_tokens off;

    # More generous header buffers, to avoid 414 on long query strings.
    large_client_header_buffers 4 16k;

    # ---------- Logging ----------------------------------------------------
    log_format main_json escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"referer":"$http_referer","ua":"$http_user_agent","rt":$request_time}';
    access_log /dev/stdout main_json;
    error_log  /dev/stderr warn;

    # ---------- Rate limiting ---------------------------------------------
    # Separate zones for generic API traffic, auth endpoints and uploads.
    # Key $binary_remote_addr → per IP. Behind an external reverse proxy
    # (e.g. Azure Front Door) configure set_real_ip_from + real_ip_header.
    limit_req_zone  $binary_remote_addr zone=api_zone:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=auth_zone:10m  rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=upload_zone:10m rate=2r/s;
    # Pictures: a page loads a few dozen of them at once, and people behind
    # one address (a class, an office) share this budget, so it is far more
    # generous than api_zone.
    limit_req_zone  $binary_remote_addr zone=media_zone:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # Clear signal for monitoring: without this, a rate limiting reject
    # returns 503 (the nginx default), indistinguishable from a real outage
    # unless you inspect the access logs.
    limit_req_status 429;
    # Same for the cap on concurrent requests per address (limit_conn).
    limit_conn_status 429;

    # ---------- Cache of public pictures ----------------------------------
    # Only the pictures Django marks `Cache-Control: public` (the landing
    # pages and the pictures of published ideas) are stored: nginx never
    # caches a `private` response, so avatars and a picture that is not yet
    # attached to an idea always reach Django and its permission check. The
    # URLs of the landing pictures carry ?v=, so a replaced picture gets a new
    # key.
    proxy_cache_path /var/lib/nginx/media-cache levels=1:2 keys_zone=media_cache:10m
                     max_size=200m inactive=1d use_temp_path=off;

    # ---------- Private pictures: avatars ---------------------------------
    # Avatars need a login, so Django checks it on every request and answers
    # with an X-Accel-Redirect to a signed URL of the blob (X-Blob-Url).
    # nginx fetches the bytes from storage and keeps them, so a worker is
    # busy for the check and not for the download. The blob name is unique per
    # upload, which is why a day in the cache is safe, and only a request
    # that Django approved ever reaches the cache.
    proxy_cache_path /var/lib/nginx/blob-cache levels=1:2 keys_zone=blob_cache:10m
                     max_size=100m inactive=1d use_temp_path=off;

    # The one kind of URL nginx will fetch for that redirect: an avatar in the
    # project's container on Azure Blob Storage. Anything else (a header that
    # is missing or malformed) leaves $blob_cache_key empty and is a 404. The
    # key is the blob name, without the signature that changes on every call.
    # The signature is base64, so it can contain a literal / and +.
    map $upstream_http_x_blob_url $blob_cache_key {
        default "";
        "~^https://[a-z0-9]{3,24}\.blob\.core\.windows\.net/locus-media/avatars/(?<blob_name>[A-Za-z0-9_-][A-Za-z0-9._-]*)\?[A-Za-z0-9%=&:._~+/-]+$" $blob_name;
    }

    # ---------- Compression -----------------------------------------------
    # Disable gzip on authenticated/dynamic responses to limit BREACH.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                       application/xml application/xml+rss text/xml image/svg+xml;
    gzip_proxied      no-cache no-store private expired auth;

    upstream django {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    upstream nextjs {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream oauth2_proxy {
        server 127.0.0.1:4180;
        keepalive 8;
    }

    # ---------- Catch-all for unknown hosts -------------------------------
    # 444: closes the connection without a response. Blocks scanners that
    # probe by arbitrary IP/host.
    server {
        listen 8080 default_server;
        listen 8081 default_server ssl;
        ssl_reject_handshake on;
        return 444;
    }

    # ---------- HTTP: ACME challenge + HTTPS redirect ---------------------
    # www.${DOMAIN} is included here only for the ACME challenge and the redirect
    # to HTTPS; the canonical redirect to ${DOMAIN} (bare, without www) happens in
    # the dedicated HTTPS block below, so the app is never served on two
    # different origins (CORS_ALLOWED_ORIGINS / CSRF_TRUSTED_ORIGINS on the api
    # stay scoped to ${DOMAIN} only).
    server {
        listen 8080;
        server_name ${DOMAIN} www.${DOMAIN};

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- HTTPS: www -> canonical domain -----------------------------
    # The certificate covers both names (certbot -d ${DOMAIN} -d
    # www.${DOMAIN}, see scripts/init-https.sh), so the TLS handshake succeeds
    # for www too; here the request is only redirected to the bare domain,
    # never reaching Django/Next.js on that origin.
    server {
        listen 8081 ssl http2;
        server_name www.${DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        return 301 https://${DOMAIN}$request_uri;
    }

    # ---------- HTTPS -----------------------------------------------------
    server {
        listen 8081 ssl http2;
        server_name ${DOMAIN};

        # ----- TLS -----
        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Mozilla "intermediate" cipher suite (wide compatibility, high security).
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_ecdh_curve         X25519:prime256v1:secp384r1;
        ssl_session_cache      shared:SSL:10m;
        ssl_session_timeout    1d;
        ssl_session_tickets    off;
        ssl_stapling           on;
        ssl_stapling_verify    on;
        # IPv4 only: the VM has no IPv6 route, and storage URLs resolve at request time.
        resolver               1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout       5s;

        # ----- Security headers (always: on error responses too) -----
        # Shared with the /static/ location below via `include` so the two
        # can never silently diverge -- see security-headers.conf.
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/security-csp.conf;

        # Django sets some of these headers itself (SecurityMiddleware,
        # clickjacking protection). Dropping its copies leaves the single
        # set nginx adds above on every proxied response.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;

        # ----- Limiti body & timeout -----
        client_max_body_size 100M;
        client_body_timeout  60s;
        send_timeout         60s;
        keepalive_timeout    65s;

        # ----- Concurrent requests per IP -----
        # Counts HTTP/2 streams, not connections: one visit to a page with
        # many pictures can have dozens in flight, and people behind one
        # address add up. The ceiling guards against a single address holding
        # on to the whole worker budget (worker_connections above).
        limit_conn conn_zone 250;

        # ----- Block hidden / sensitive files -----
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        location ~ \.(env|git|svn|htaccess)$ {
            deny all;
        }

        # ----- Auth endpoint: rate limit stretto -----
        location ~ ^/api/account/(login|signup|password-reset)/ {
            limit_req zone=auth_zone burst=3 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ----- Upload: dedicated rate limit + streaming -----
        location ~ ^/api/(account/upload_avatar|posts/upload_image)/ {
            limit_req zone=upload_zone burst=5 nodelay;
            client_max_body_size 100M;
            proxy_pass http://django;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ----- Pictures served by Django -----
        # A longer prefix than /api/, so it wins over the generic API block.
        # add_header does not inherit once a location declares its own, so
        # the security headers are included again.
        location /api/media/ {
            limit_req zone=media_zone burst=200 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_cache media_cache;
            # Visitors asking for the same picture while it is being fetched
            # wait for that one fetch instead of each going to Django.
            proxy_cache_lock on;
            include /etc/nginx/security-headers.conf;
            include /etc/nginx/security-csp.conf;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ----- Avatars: fetched by nginx after Django approved the request -----
        # Reached only through X-Accel-Redirect from /api/media/ (internal).
        # The request still carries the visitor's headers, so none of them is
        # passed on: the signed URL is the only credential storage sees, and
        # the visitor's session cookies never leave this server.
        location /_blob/ {
            internal;
            if ($blob_cache_key = "") {
                return 404;
            }
            set $blob_url $upstream_http_x_blob_url;
            proxy_pass $blob_url;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            # The default depth of 1 rejects a chain with two intermediate CAs.
            proxy_ssl_verify_depth 4;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_cache blob_cache;
            proxy_cache_key $blob_cache_key;
            proxy_cache_valid 200 1d;
            proxy_cache_lock on;

            # A missing or refused blob is a plain 404, not storage's XML.
            proxy_intercept_errors on;
            error_page 400 403 404 = @blob_missing;

            # What the browser needs, and not what storage adds about itself.
            proxy_hide_header Server;
            proxy_hide_header x-ms-request-id;
            proxy_hide_header x-ms-version;
            proxy_hide_header x-ms-blob-type;
            proxy_hide_header x-ms-creation-time;
            proxy_hide_header x-ms-lease-status;
            proxy_hide_header x-ms-lease-state;
            proxy_hide_header x-ms-server-encrypted;
            proxy_hide_header x-ms-meta-name;
            proxy_hide_header x-ms-blob-content-md5;
            proxy_hide_header Content-MD5;
            # nginx keeps the Cache-Control that Django set on its redirect.
            include /etc/nginx/security-headers.conf;
            include /etc/nginx/security-csp.conf;
        }

        location @blob_missing {
            return 404;
        }

        # ----- Generic API -----
        location /api/ {
            limit_req zone=api_zone burst=40 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ----- Django admin: gated behind GitHub-org SSO (oauth2-proxy) -----
        # oauth2-proxy is a localhost-only process (supervisord); nginx asks
        # it via an internal auth_request subrequest before ever proxying to
        # Django, so an unauthenticated request never reaches gunicorn, and
        # never would even if something inside this same container tried to
        # reach 127.0.0.1:8000/admin/ directly, bypassing this location.
        # Django's own staff login still applies on top, as a second,
        # independent layer.
        # A bare "/admin/" path (not a full scheme://host URI) makes nginx
        # complete the Location header with $server_port when that port
        # isn't the protocol's default -- 8081 here, this container's own
        # internal HTTPS listener, never the external 443 Docker maps it
        # from. Spelling out the scheme and host avoids that entirely.
        location = /admin { return 301 https://$host/admin/; }

        location /admin/ {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/sign_in;

            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ----- Self-service TOTP enrollment/verification (apps.account.otp_urls) -----
        # Same GitHub-org SSO gate as /admin/, since this is part of the same
        # admin-access path (MFAAdminSite redirects an unverified staff user
        # here). The view itself also enforces @staff_member_required.
        location /staff/ {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/sign_in;

            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ----- oauth2-proxy: sign-in / callback / sign-out -----
        location /oauth2/ {
            proxy_pass http://oauth2_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
            proxy_set_header X-Auth-Request-Redirect $request_uri;
        }

        # ----- oauth2-proxy: internal auth-check subrequest only -----
        location = /oauth2/auth {
            internal;
            proxy_pass http://oauth2_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
        }

        # ----- Static files Django -----
        location /static/ {
            alias /static/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, immutable" always;
            # nginx's add_header does NOT inherit from the parent (server)
            # context once a location declares its own, so redeclaring only
            # a subset of the server-level security headers here would
            # silently drop the rest for every /static/ response --
            # `include` the same shared snippet the server block uses
            # instead of copy-pasting them again, so the two can't drift.
            include /etc/nginx/security-headers.conf;
            include /etc/nginx/security-csp.conf;
        }

        # ----- security.txt (RFC 9116) -----
        # An exact match wins over the hidden-files block above, so this one
        # dot path is served, by the frontend (client/public/.well-known).
        location = /.well-known/security.txt {
            include /etc/nginx/security-headers.conf;
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- Frontend Next.js -----
        # add_header here (through the include) stops the server-level ones
        # from being inherited, which is the point: the CSP baseline is left
        # out because the client middleware sets its own on these routes.
        location / {
            include /etc/nginx/security-headers.conf;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }
}
