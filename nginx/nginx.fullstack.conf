# nginx template – ${DOMAIN} viene sostituito al runtime da init-https.sh
# tramite envsubst.
# NON modificare direttamente nginx.conf: viene rigenerato a ogni avvio
# del container.

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Nasconde la versione di nginx negli header e nelle pagine di errore.
    server_tokens off;

    # Buffer header piu' generosi per evitare 414 su query string lunghe.
    large_client_header_buffers 4 16k;

    # ---------- Logging ----------------------------------------------------
    log_format main_json escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"referer":"$http_referer","ua":"$http_user_agent","rt":$request_time}';
    access_log /dev/stdout main_json;
    error_log  /dev/stderr warn;

    # ---------- Rate limiting ---------------------------------------------
    # Zone separate per traffico API generico, endpoint auth, upload.
    # Chiave $binary_remote_addr → per-IP. Dietro reverse proxy esterno
    # (es. Azure Front Door) configurare set_real_ip_from + real_ip_header.
    limit_req_zone  $binary_remote_addr zone=api_zone:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=auth_zone:10m  rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=upload_zone:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # ---------- Compressione ----------------------------------------------
    # Disattiva gzip su risposte autenticate/dinamiche per limitare BREACH.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                       application/xml application/xml+rss text/xml image/svg+xml;
    gzip_proxied      no-cache no-store private expired auth;

    upstream django {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    upstream nextjs {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # ---------- Catch-all per host sconosciuti ----------------------------
    # 444: chiude la connessione senza risposta. Blocca scanner che
    # probano per IP/host arbitrario.
    server {
        listen 8080 default_server;
        listen 8081 default_server ssl;
        ssl_reject_handshake on;
        return 444;
    }

    # ---------- HTTP: ACME challenge + redirect HTTPS ---------------------
    server {
        listen 8080;
        server_name ${DOMAIN};

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- HTTPS -----------------------------------------------------
    server {
        listen 8081 ssl;
        http2 on;
        server_name ${DOMAIN};

        # ----- TLS -----
        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Cipher suite Mozilla "intermediate" (compat ampia, sicurezza alta).
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_ecdh_curve         X25519:prime256v1:secp384r1;
        ssl_session_cache      shared:SSL:10m;
        ssl_session_timeout    1d;
        ssl_session_tickets    off;
        ssl_stapling           on;
        ssl_stapling_verify    on;
        resolver               1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout       5s;

        # ----- Security headers (always: anche sulle risposte di errore) -----
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        # CSP relativamente permissivo per Next.js inline; restringere via nonce
        # richiede modifiche al rendering server-side e va fatto in step separato.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # ----- Limiti body & timeout -----
        client_max_body_size 100M;
        client_body_timeout  60s;
        send_timeout         60s;
        keepalive_timeout    65s;

        # ----- Connessioni concorrenti per IP -----
        limit_conn conn_zone 50;

        # ----- Blocco file nascosti / sensibili -----
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        location ~ \.(env|git|svn|htaccess)$ {
            deny all;
        }

        # ----- Auth endpoint: rate limit stretto -----
        location ~ ^/api/account/(login|signup|password-reset)/ {
            limit_req zone=auth_zone burst=3 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ----- Upload: rate limit dedicato + streaming -----
        location ~ ^/api/(account/upload_thumbnail|posts/upload_image)/ {
            limit_req zone=upload_zone burst=5 nodelay;
            client_max_body_size 100M;
            proxy_pass http://django;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ----- API generica -----
        location /api/ {
            limit_req zone=api_zone burst=40 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ----- Static files Django -----
        location /static/ {
            alias /static/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, immutable" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ----- Frontend Next.js -----
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }
}
