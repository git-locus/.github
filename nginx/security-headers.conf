# Shared security headers -- `include`d from the HTTPS server block, from
# the /static/ location and from the Next.js location in
# nginx.fullstack.conf. nginx's add_header does NOT inherit from the parent
# context once a location declares its own add_header, so any location
# redeclaring a subset of these instead of including this file would
# silently drop the rest.
#
# The Content-Security-Policy baseline lives in security-csp.conf: the
# Next.js location leaves it out because the client sets its own, stricter,
# nonce-based policy, and two CSP headers on one response would only be
# noise.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
