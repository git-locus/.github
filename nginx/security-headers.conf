# Shared security headers -- `include`d from both the HTTPS server block
# and the /static/ location in nginx.fullstack.conf. nginx's add_header
# does NOT inherit from the parent context once a location declares its
# own add_header, so any location redeclaring a subset of these instead
# of including this file would silently drop the rest.
#
# CSP note: script-src/style-src still carry 'unsafe-inline' here as a
# nginx-level baseline. The client (Next.js) additionally sets its own,
# stricter, nonce-based CSP via middleware for its own responses -- browsers
# enforce the intersection of all delivered CSP headers, so that nonce
# policy is not weakened by this one; it only adds a second, independent
# constraint. Don't loosen this file's CSP assuming the client-side one
# alone is enough -- it also has to hold for anything nginx serves directly
# (e.g. /static/) where no Next.js middleware ever runs.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
