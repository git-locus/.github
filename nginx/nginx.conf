# nginx.conf per l'ambiente Docker Compose.
#
# Di sviluppo locale usa knowledge/development/nginx/nginx.conf
# (upstream a 0.0.0.0 sulla macchina host).
# Qui gli upstream puntano ai service name di compose.

events {}

http {
    server_tokens off;
    log_format main_json escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time}';
    access_log /dev/stdout main_json;
    error_log  /dev/stderr warn;

    upstream django {
        server api:8000;
    }

    upstream nextjs {
        server client:3000;
    }

    server {
        listen 80;

        # Blocca file nascosti / .env anche in dev.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        location ~ \.(env|git|svn|htaccess)$ {
            deny all;
        }

        location / {
            # next dev richiede il forward dei websocket:
            # https://github.com/vercel/next.js/issues/30491
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /static/ {
            alias /static/;
        }

        # Limite ragionevole anche in dev: assomiglia alla prod (100M).
        client_max_body_size 100M;
    }
}
