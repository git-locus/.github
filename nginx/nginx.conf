# nginx.conf for the Docker Compose environment.
#
# For local development outside compose use knowledge/development/nginx/nginx.conf
# (upstreams on 0.0.0.0 of the host machine).
# Here the upstreams point to the compose service names.

events {}

http {
    server_tokens off;
    log_format main_json escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time}';
    access_log /dev/stdout main_json;
    error_log  /dev/stderr warn;

    upstream django {
        server api:8000;
    }

    upstream nextjs {
        server client:3000;
    }

    server {
        listen 80;

        # Security headers (subset di quelli prod per ridurre noise ZAP).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Block hidden files and .env in dev too.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        location ~ \.(env|git|svn|htaccess)$ {
            deny all;
        }

        location / {
            # next dev needs websocket forwarding:
            # https://github.com/vercel/next.js/issues/30491
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /static/ {
            alias /static/;
        }

        # A reasonable limit in dev too: it resembles prod (100M).
        client_max_body_size 100M;
    }
}
