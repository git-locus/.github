# Temporary config used by init-https.sh to serve the ACME challenge
# during the first acquisition of the Let's Encrypt certificate.
# nginx is started with this config, certbot does the challenge, then nginx is stopped.

events {}

http {
    server {
        listen 8080;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 'ACME ready';
            add_header Content-Type text/plain;
        }
    }
}
