# Content-Security-Policy baseline for everything nginx answers on its own
# (static files, error pages) and for the Django routes. It allows inline
# script and style, so it is a baseline, not a strict policy.
# The Next.js routes do not receive this header: the client middleware sets
# a stricter nonce-based policy for them (see client/src/middleware.js), and
# this baseline must stay safe on its own for the rest.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
