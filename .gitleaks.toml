# Gitleaks config — extends default rules
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
[extend]
useDefault = true

# ----------------------------------------------------------------------
# Allowlist — REAL secrets must NEVER be added here.
# ----------------------------------------------------------------------
# Use [[allowlists]] (plural / array form). The legacy single
# [allowlist] table cannot coexist with [[allowlists]] in newer
# gitleaks versions, so we use only the array form.
# ----------------------------------------------------------------------

# Microsoft Azurite well-known development storage account key.
# Published by Microsoft in the official Azurite documentation:
# https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azurite
[[allowlists]]
description = "Microsoft Azurite well-known development account key"
regexes = [
  # Match the well-known Azurite key (and its line-split variants in source files)
  '''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq''',
]

# Build artefacts and caches that may legitimately contain
# high-entropy strings (e.g. Next.js prerender keys).
[[allowlists]]
description = "Build artefacts / caches"
paths = [
  '''(.*/)?\.next/.*''',
  '''(.*/)?__pycache__/.*''',
  '''(.*/)?node_modules/.*''',
]

# Published SHA256 checksums of the oauth2-proxy release archives, pinned in
# the Dockerfile and verified at build time. Public values, not secrets.
[[allowlists]]
description = "oauth2-proxy release checksums in the Dockerfile"
condition = "AND"
paths = [
  '''Dockerfile''',
]
regexes = [
  '''[0-9a-f]{64}''',
]
