[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; ------------------------------------------------------------------
; Django – migrate + collectstatic al primo avvio, poi gunicorn
; ------------------------------------------------------------------
[program:api]
directory=/api
command=/api/entrypoint.sh
user=django
environment=
    VIRTUAL_ENV="/api/.venv",
    PATH="/api/.venv/bin:/usr/local/bin:/usr/bin:/bin",
    HOME="/tmp"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ------------------------------------------------------------------
; Next.js standalone (node server.js)
; ------------------------------------------------------------------
[program:client]
directory=/client
command=node server.js
user=nextjs
environment=
    NODE_ENV="production",
    PORT="3000",
    HOSTNAME="127.0.0.1"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; ------------------------------------------------------------------
; oauth2-proxy – gate GitHub-org su /admin (auth_request lato nginx,
; vedi nginx.fullstack.conf). Legge OAUTH2_PROXY_CLIENT_ID/SECRET/
; COOKIE_SECRET dall'ambiente del container (nomi standard riconosciuti
; direttamente dal binario, nessun flag da passare per questi tre).
; ------------------------------------------------------------------
[program:oauth2-proxy]
command=/usr/local/bin/oauth2-proxy --http-address=127.0.0.1:4180 --provider=github --github-org=git-locus --email-domain=* --redirect-url=https://%(ENV_DOMAIN)s/oauth2/callback --upstream=static://200 --cookie-secure=true --cookie-httponly=true --cookie-samesite=lax --skip-provider-button=true --reverse-proxy=true --silence-ping-logging=true
user=oauth2proxy
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=25

; ------------------------------------------------------------------
; Nginx – parte per ultimo, quando api e client sono pronti
; ------------------------------------------------------------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

; ------------------------------------------------------------------
; Certbot renew – controlla il rinnovo ogni 12 ore
; ------------------------------------------------------------------
[program:certbot-renew]
command=/bin/sh -c "while true; do sleep 12h; certbot renew --quiet --deploy-hook 'nginx -s reload'; done"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
