[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; ------------------------------------------------------------------
; Django – migrate + collectstatic on first start, then gunicorn
; ------------------------------------------------------------------
[program:api]
directory=/api
command=/api/entrypoint.sh
user=django
environment=
    VIRTUAL_ENV="/api/.venv",
    PATH="/api/.venv/bin:/usr/local/bin:/usr/bin:/bin",
    HOME="/tmp"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ------------------------------------------------------------------
; Daily digest – once a day runs `manage.py send_digest`. Sleeps and sends
; nothing unless DIGEST_ENABLED=1 (see scripts/send-digest-loop.sh)
; ------------------------------------------------------------------
[program:digest]
directory=/api
command=/usr/local/bin/send-digest-loop.sh
user=django
environment=
    VIRTUAL_ENV="/api/.venv",
    PATH="/api/.venv/bin:/usr/local/bin:/usr/bin:/bin",
    HOME="/tmp"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=15

; ------------------------------------------------------------------
; Next.js standalone (node server.js)
; ------------------------------------------------------------------
[program:client]
directory=/client
command=node server.js
user=nextjs
environment=
    NODE_ENV="production",
    PORT="3000",
    HOSTNAME="127.0.0.1"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; ------------------------------------------------------------------
; oauth2-proxy – GitHub-organization gate on /admin (auth_request on the nginx
; side, see nginx.fullstack.conf). It reads OAUTH2_PROXY_CLIENT_ID/SECRET/
; COOKIE_SECRET from the container environment (standard names recognised
; directly by the binary, no flag needed for these three).
; ------------------------------------------------------------------
[program:oauth2-proxy]
command=/usr/local/bin/oauth2-proxy --http-address=127.0.0.1:4180 --provider=github --github-org=git-locus --email-domain=* --redirect-url=https://%(ENV_DOMAIN)s/oauth2/callback --upstream=static://200 --cookie-secure=true --cookie-httponly=true --cookie-samesite=lax --skip-provider-button=true --reverse-proxy=true --silence-ping-logging=true
user=oauth2proxy
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=25

; ------------------------------------------------------------------
; Nginx – starts last, when api and client are ready
; ------------------------------------------------------------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

; ------------------------------------------------------------------
; Certbot renew – checks for renewal every 12 hours
; ------------------------------------------------------------------
[program:certbot-renew]
command=/bin/sh -c "while true; do sleep 12h; certbot renew --deploy-hook 'nginx -s reload'; done"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
