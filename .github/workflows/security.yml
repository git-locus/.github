name: Security 🛡️

# Security scan per la repo .github (deploy bundle: Dockerfile, nginx,
# supervisord, scripts, workflow di deploy). Focus: container, IaC, workflow.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:

  hadolint:
    name: Hadolint (Dockerfile) 🐳
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          failure-threshold: warning
      - uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e  # v4.35.4
        if: always()
        continue-on-error: true
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  trivy-config:
    name: Trivy (IaC + Dockerfile) 🛰️
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e  # v4.35.4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-config

  shellcheck:
    name: Shellcheck (scripts) 🐚
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          set -e
          shopt -s globstar nullglob
          files=(scripts/**/*.sh scripts/*.sh)
          if [ ${#files[@]} -gt 0 ]; then
            shellcheck -S warning "${files[@]}"
          fi

  actionlint:
    name: actionlint + zizmor (workflow audit) ⚙️
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - name: Run actionlint
        # continue-on-error: actionlint può segnalare shellcheck warnings
        # ma non deve bloccare zizmor / upload-sarif nello stesso job.
        continue-on-error: true
        run: ./actionlint -color
      - uses: astral-sh/setup-uv@4959332f0f014c5280e7eac8b70c90cb574c9f9b  # v6.6.0
      - name: zizmor
        shell: bash
        run: |
          set +e
          # Pre-crea uno stub SARIF: se uvx fallisce o non scrive nulla, upload-sarif
          # avrà comunque un file valido da consumare.
          printf '%s\n' '{"version":"2.1.0","$schema":"https://docs.oasis-open.org/sarif/sarif/v2.1.0/cos02/schemas/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"zizmor"}},"results":[]}]}' > zizmor.sarif
          uvx zizmor==1.5.2 --no-progress --format sarif .github/workflows > zizmor.sarif.tmp 2>zizmor.err
          rc=$?
          if [ -s zizmor.sarif.tmp ]; then
            mv zizmor.sarif.tmp zizmor.sarif
          else
            echo "::warning::zizmor non ha prodotto SARIF (rc=$rc). Stderr:"
            cat zizmor.err || true
          fi
          exit 0
      - uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e  # v4.35.4
        if: always()
        continue-on-error: true
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  gitleaks:
    name: Gitleaks (secret scan) 🔑
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose
