name: Site health 🩺

# Every hour (at minute 7) checks that the production site answers and that the
# TLS certificate is not close to expiry. If something is wrong the job fails
# and GitHub sends the failed workflow notification.
#
# Uses the DOMAIN variable (Repository -> Settings -> Variables -> Actions).
# /landing answers 200 directly, without redirects.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-health
  cancel-in-progress: true

jobs:
  check:
    name: Site up and certificate valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOMAIN: ${{ vars.DOMAIN }}
      MIN_CERT_DAYS: "14"
    steps:
      - name: Check HTTP status
        run: |
          set -euo pipefail
          if [ -z "$DOMAIN" ]; then
            echo "::error::vars.DOMAIN is not configured"
            exit 1
          fi
          url="https://${DOMAIN}/landing"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 5 --retry-all-errors "$url" || true)
          echo "GET ${url} -> ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::${url} answered ${code:-no response} (expected 200)"
            exit 1
          fi

      - name: Check certificate expiry
        run: |
          set -euo pipefail
          end=$(openssl s_client -connect "${DOMAIN}:443" -servername "${DOMAIN}" </dev/null 2>/dev/null \
            | openssl x509 -noout -enddate | cut -d= -f2)
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "Certificate for ${DOMAIN} expires ${end} (${days} days left)"
          if [ "$days" -lt "$MIN_CERT_DAYS" ]; then
            echo "::error::The certificate of ${DOMAIN} expires in ${days} days (threshold ${MIN_CERT_DAYS})"
            exit 1
          fi
