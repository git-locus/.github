name: DAST – ZAP Baseline 🌐

# Dynamic scan: avvia lo stack locale (docker-compose) ed esegue OWASP ZAP
# baseline scan contro l'istanza dev. È un baseline scan: passivo, non manda
# payload distruttivi. Adatto a girare in CI/notturno.
#
# IMPORTANTE: testa lo stack in modalità dev (settings_dev, DEBUG=True). I
# finding correlati a configurazione dev (es. HSTS assente, server header
# verbose) saranno legittimi in produzione e vanno gestiti via .zap/rules.tsv.
#
# Per testare la produzione vera serve un'istanza staging con immagine prod;
# in tal caso aggiungere un job DAST separato che punti al dominio staging.

on:
  schedule:
    - cron: "0 2 * * *"   # ogni notte 02:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'nginx/**'
      - 'supervisord.conf'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/dast-zap.yml'

permissions:
  contents: read

jobs:
  zap:
    name: ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write   # ZAP action può aprire issue di tracking (opzionale)
    steps:
      - name: Checkout deploy bundle
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # docker-compose si aspetta `../api` e `../client`, quindi cloniamoli
      # in una struttura compatibile.
      - name: Checkout api
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: git-locus/api
          ref: dev
          path: workspace/api

      - name: Checkout client
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: git-locus/client
          ref: dev
          path: workspace/client

      - name: Move .github bundle in workspace
        run: |
          mkdir -p workspace/.github
          rsync -a --exclude='workspace' ./ workspace/.github/

      - name: Bring up stack
        working-directory: workspace/.github
        run: |
          # Nginx in compose ascolta su 8080 (vedi nginx/nginx.dev.conf).
          docker compose up -d --wait --wait-timeout 240 azurite api client nginx || \
            (docker compose logs --tail=200; exit 1)

      - name: Wait for nginx ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/categories/ >/dev/null; then
              echo "stack ready"; exit 0
            fi
            sleep 2
          done
          echo "stack not ready"
          docker compose -f workspace/.github/docker-compose.yml logs --tail=200
          exit 1

      - name: Prepare ZAP rules dir
        run: |
          mkdir -p .zap
          # Ignora finding noti accettabili in dev:
          #   10202: HSTS missing (atteso in HTTP dev)
          #   10038: CSP missing (gestito a livello prod / a parte)
          #   10063: Permissions-Policy missing
          [ -f .zap/rules.tsv ] || cat > .zap/rules.tsv <<'EOF'
          10202	IGNORE	(HSTS atteso solo in prod TLS)
          10038	WARN	(CSP gestita separatamente)
          10063	WARN	(Permissions-Policy in roadmap)
          EOF

      - name: ZAP Baseline scan
        uses: zaproxy/action-baseline@75ee1686750ab1511a73b26b77a2aedd295053ed  # v0.14.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'   # ajax spider attivo, json report
          allow_issue_writing: false
          fail_action: false      # non blocca PR finché non si stabilizza la baseline

      - name: Dump compose logs on failure
        if: failure()
        working-directory: workspace/.github
        run: docker compose logs --tail=400
