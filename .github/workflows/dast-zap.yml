name: DAST – ZAP Baseline 🌐

# Passive baseline scan con OWASP ZAP.
#
# Strategia:
#   1. Prova a scansionare il sito di produzione (https://$DOMAIN).
#   2. Se la produzione non è raggiungibile, fa fallback sullo stack
#      Docker Compose locale (dev) — ma il job emette un errore
#      per segnalare che la scansione non ha coperto la configurazione reale.
#
# La variabile DOMAIN deve essere configurata in:
#   Repository → Settings → Variables → Actions  (es. "locus.now")

on:
  schedule:
    - cron: "0 2 * * 1"   # lunedì 02:00 UTC (weekly)
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'nginx/**'
      - 'supervisord.conf'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/dast-zap.yml'

permissions:
  contents: read

jobs:
  zap:
    name: ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout deploy bundle
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # ----------------------------------------------------------------
      # Decide target: prod o fallback locale
      # ----------------------------------------------------------------
      - name: Probe production
        id: probe
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "::warning::vars.DOMAIN non configurata – fallback a stack locale"
            echo "target=local" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROD_URL="https://${DOMAIN}"
          if curl -fsSk --connect-timeout 10 --max-time 20 "${PROD_URL}/landing" >/dev/null 2>&1; then
            echo "Production reachable at ${PROD_URL}"
            echo "target=prod" >> "$GITHUB_OUTPUT"
            echo "url=${PROD_URL}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Produzione ${PROD_URL} non raggiungibile – fallback a stack locale"
            echo "target=local" >> "$GITHUB_OUTPUT"
          fi

      # ----------------------------------------------------------------
      # Fallback: checkout repos + compose stack (solo se serve)
      # ----------------------------------------------------------------
      - name: Checkout api
        if: steps.probe.outputs.target == 'local'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          repository: git-locus/api
          token: ${{ secrets.INFRA_REPO_PAT }}
          ref: dev
          path: workspace/api

      - name: Checkout client
        if: steps.probe.outputs.target == 'local'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          repository: git-locus/client
          token: ${{ secrets.INFRA_REPO_PAT }}
          ref: dev
          path: workspace/client

      - name: Prepare workspace
        if: steps.probe.outputs.target == 'local'
        run: |
          mkdir -p workspace/.github
          rsync -a --exclude='workspace' ./ workspace/.github/

      - name: Bring up stack
        if: steps.probe.outputs.target == 'local'
        working-directory: workspace/.github
        run: |
          docker compose up -d --wait --wait-timeout 240 azurite api client nginx || \
            (docker compose logs --tail=200; exit 1)

      - name: Wait for stack ready
        if: steps.probe.outputs.target == 'local'
        run: |
          for _i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/categories/ >/dev/null 2>&1; then
              echo "stack ready"; exit 0
            fi
            sleep 2
          done
          echo "stack not ready"
          docker compose -f workspace/.github/docker-compose.yml logs --tail=200
          exit 1

      # ----------------------------------------------------------------
      # Imposta l'URL di scansione definitivo
      # ----------------------------------------------------------------
      - name: Set scan target
        id: target
        env:
          PROBE_TARGET: ${{ steps.probe.outputs.target }}
          PROBE_URL: ${{ steps.probe.outputs.url }}
        run: |
          if [ "$PROBE_TARGET" = "prod" ]; then
            echo "url=${PROBE_URL}" >> "$GITHUB_OUTPUT"
            echo "Scanning production: ${PROBE_URL}"
          else
            echo "url=http://localhost:8080" >> "$GITHUB_OUTPUT"
            echo "Scanning local stack: http://localhost:8080"
          fi

      # ----------------------------------------------------------------
      # ZAP rules e scan
      # ----------------------------------------------------------------
      - name: Prepare ZAP rules
        run: |
          mkdir -p .zap
          cat > .zap/rules.tsv <<'EOF'
          10027	IGNORE	(Suspicious comments in bundled JS – false positive)
          10094	IGNORE	(Base64 in JS bundles – not secrets)
          10096	IGNORE	(Unix timestamps in React DOM – informational)
          10109	IGNORE	(Modern Web Application – informational)
          10110	IGNORE	(Dangerous JS functions in bundled Turbopack/React – not app code)
          90005	IGNORE	(Sec-Fetch-Dest missing – scanner artefact, not app issue)
          EOF

      - name: ZAP Baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: false
          fail_action: false

      - name: Dump compose logs on failure
        if: failure() && steps.probe.outputs.target == 'local'
        working-directory: workspace/.github
        run: docker compose logs --tail=400
