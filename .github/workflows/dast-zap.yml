name: DAST – ZAP Baseline 🌐

# Passive baseline scan with OWASP ZAP.
#
# Strategy:
#   1. Try to scan the production site (https://$DOMAIN).
#   2. If production is not reachable, fall back to the local Docker Compose
#      stack (dev); the job still raises an error to signal that the scan did
#      not cover the real configuration.
#
# The DOMAIN variable must be configured in:
#   Repository → Settings → Variables → Actions  (for example "locus.now")

on:
  schedule:
    - cron: "0 2 * * 1"   # Monday 02:00 UTC (weekly)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: ZAP Baseline
    runs-on: ubuntu-latest
    # The fallback mints the GitHub App token, whose key lives in this environment (only `main` may use it). For that reason the scan no longer runs on pull requests.
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout deploy bundle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # ----------------------------------------------------------------
      # Decide target: prod o fallback locale
      # ----------------------------------------------------------------
      - name: Probe production
        id: probe
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "::warning::vars.DOMAIN is not configured – falling back to the local stack"
            echo "target=local" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROD_URL="https://${DOMAIN}"
          if curl -fsSk --connect-timeout 10 --max-time 20 "${PROD_URL}/landing" >/dev/null 2>&1; then
            echo "Production reachable at ${PROD_URL}"
            echo "target=prod" >> "$GITHUB_OUTPUT"
            echo "url=${PROD_URL}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Production ${PROD_URL} is not reachable – falling back to the local stack"
            echo "target=local" >> "$GITHUB_OUTPUT"
          fi

      # ----------------------------------------------------------------
      # Fallback: checkout repos + compose stack (only if needed)
      # ----------------------------------------------------------------
      # Short-lived installation token of the GitHub App (see deploy.yml),
      # reused here read-only, and only if the fallback is really needed.
      - name: Generate GitHub App token
        id: app-token
        if: steps.probe.outputs.target == 'local'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: git-locus
          repositories: |
            api
            client
          permission-contents: read

      - name: Checkout api
        if: steps.probe.outputs.target == 'local'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: git-locus/api
          token: ${{ steps.app-token.outputs.token }}
          ref: dev
          path: workspace/api

      - name: Checkout client
        if: steps.probe.outputs.target == 'local'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: git-locus/client
          token: ${{ steps.app-token.outputs.token }}
          ref: dev
          path: workspace/client

      - name: Prepare workspace
        if: steps.probe.outputs.target == 'local'
        run: |
          mkdir -p workspace/.github
          rsync -a --exclude='workspace' ./ workspace/.github/

      - name: Bring up stack
        if: steps.probe.outputs.target == 'local'
        working-directory: workspace/.github
        run: |
          docker compose up -d --wait --wait-timeout 240 azurite api client nginx || \
            (docker compose logs --tail=200; exit 1)

      - name: Wait for stack ready
        if: steps.probe.outputs.target == 'local'
        run: |
          for _i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/categories/ >/dev/null 2>&1; then
              echo "stack ready"; exit 0
            fi
            sleep 2
          done
          echo "stack not ready"
          docker compose -f workspace/.github/docker-compose.yml logs --tail=200
          exit 1

      # ----------------------------------------------------------------
      # Set the final scan URL
      # ----------------------------------------------------------------
      - name: Set scan target
        id: target
        env:
          PROBE_TARGET: ${{ steps.probe.outputs.target }}
          PROBE_URL: ${{ steps.probe.outputs.url }}
        run: |
          if [ "$PROBE_TARGET" = "prod" ]; then
            echo "url=${PROBE_URL}" >> "$GITHUB_OUTPUT"
            echo "Scanning production: ${PROBE_URL}"
          else
            echo "url=http://localhost:8080" >> "$GITHUB_OUTPUT"
            echo "Scanning local stack: http://localhost:8080"
          fi

      # ----------------------------------------------------------------
      # ZAP rules e scan
      # ----------------------------------------------------------------
      - name: Prepare ZAP rules
        run: |
          mkdir -p .zap
          cat > .zap/rules.tsv <<'EOF'
          10027	IGNORE	(Suspicious comments in bundled JS – false positive)
          10094	IGNORE	(Base64 in JS bundles – not secrets)
          10096	IGNORE	(Unix timestamps in React DOM – informational)
          10109	IGNORE	(Modern Web Application – informational)
          10110	IGNORE	(Dangerous JS functions in bundled Turbopack/React – not app code)
          90005	IGNORE	(Sec-Fetch-Dest missing – scanner artefact, not app issue)
          EOF

      - name: ZAP Baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: false
          fail_action: false

      - name: Dump compose logs on failure
        if: failure() && steps.probe.outputs.target == 'local'
        working-directory: workspace/.github
        run: docker compose logs --tail=400
