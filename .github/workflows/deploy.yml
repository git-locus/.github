# Workflow A – Locus deploy pipeline
#
# Builds the fullstack image, creates the sync bundle and pushes it to the
# sync/<run-id>-<sha> branch of docker2azure4student.
# Workflow B of that repository picks up the push and deploys to Azure.
#
# Triggers:
#   - repository_dispatch → called by api and client on a push to main
#   - workflow_dispatch   → manual deploy from the GitHub UI
#
# Secrets and variables: all in THIS repository (.github) → Settings → Secrets / Variables
#
#   Secrets:
#     APP_CLIENT_ID                Client ID of the "locus-deploy-bot" GitHub App (or
#                                  similar), installed on api, client,
#                                  docker2azure4student with Contents: Read and
#                                  write permission. It replaces INFRA_REPO_PAT: the
#                                  generated token is auto-scoped to the repositories
#                                  the App is installed on and expires after 1 hour,
#                                  and is not tied to a personal account. App settings
#                                  → "Client ID" (not the numeric App ID, deprecated
#                                  for this use).
#     APP_PRIVATE_KEY              Private key (.pem) of the same GitHub App.
#     CONTAINER_REGISTRY_PASSWORD Token or password for the container registry
#
#   Variables (Settings → Variables → Actions):
#     REGISTRY_LOGIN_SERVER       for example ghcr.io
#     IMAGE_REGISTRY              for example ghcr.io/git-locus
#     IMAGE_NAME                  for example locus
#     CONTAINER_REGISTRY_USERNAME Registry username

name: Build & sync to Azure infra

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source repository (api | client | manual)'
        type: string
        required: false
        default: 'manual'
  # Push to main of the .github repository: the workflow starts ONLY if files that
  # affect the fullstack image or the workflow itself are touched. Changes to
  # README, knowledge, agents, instructions and so on do NOT trigger a deploy.
  # paths: applies only to the push trigger, not to repository_dispatch.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'Dockerfile'
      - 'nginx/**'
      - 'supervisord.conf'
      - 'scripts/**'
      - 'app.env.example'
      - 'docker-compose.yml'

permissions:
  contents: read
  packages: write

# api and client each dispatch this workflow independently on their own
# push-to-main (see their notify-deploy.yml); every run always rebuilds
# from whatever is CURRENTLY on both repos' main, regardless of which one
# triggered it. Without this, two dispatches close together (e.g. an api
# release followed shortly by a client release) start two overlapping
# build-and-sync runs, each pushing its own sync/<run-id>-<sha> bundle to
# docker2azure4student -- whose own deploy-from-sync.yml has no
# cross-branch concurrency guard (its `concurrency.group` is keyed by
# branch name, which is unique per sync bundle), so two such bundles
# landing close together can trigger two real, overlapping
# Terraform-driven deploys against the same production app-service.
# Queueing runs here (one at a time, oldest first) means at most one sync
# bundle is ever in flight, which prevents that downstream race without
# touching docker2azure4student itself.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  INFRA_REPO: git-locus/docker2azure4student
  INFRA_REPO_DEFAULT_BRANCH: main
  SYNC_BRANCH_PREFIX: sync

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    if: github.event.client_payload.source_repo != 'knowledge'

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout of the whole .github repository with all the sub-repositories
      # ------------------------------------------------------------------
      - name: Checkout .github repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: dot-github

      # Short-lived installation token (expires after 1h) of the GitHub App,
      # auto-scoped to the repositories listed below. It replaces INFRA_REPO_PAT.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: git-locus
          repositories: |
            api
            client
            docker2azure4student
          # Explicitly cap the token to this single permission, even if the App is
          # installed with broader permissions in the future (zizmor: github-app).
          permission-contents: write

      # Separate checkout of api and client (they are independent repositories)
      - name: Checkout api repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: git-locus/api
          token: ${{ steps.app-token.outputs.token }}
          path: api

      - name: Checkout client repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: git-locus/client
          token: ${{ steps.app-token.outputs.token }}
          path: client

      # ------------------------------------------------------------------
      # 2. Prepare the build context: put everything at the same level,
      #    as the Dockerfile expects (.github/ api/ client/)
      # ------------------------------------------------------------------
      - name: Prepare build context
        run: |
          mkdir -p build-context
          cp -r dot-github build-context/.github
          cp -r api         build-context/api
          cp -r client      build-context/client

      # ------------------------------------------------------------------
      # 3. Build and push the fullstack image
      # ------------------------------------------------------------------
      # Secrets are passed as env vars (not interpolated inline) to avoid leaks
      # with tracing or `set -x`. GitHub masks the values anyway, but the `env:`
      # pattern is the recommended practice.
      - name: Docker login
        env:
          REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_SERVER" \
            -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build and push image
        id: build
        working-directory: build-context
        env:
          SHORT_SHA: ${{ github.event.client_payload.source_sha || github.sha }}
          IMAGE_URI: ${{ secrets.IMAGE_REGISTRY }}/${{ secrets.IMAGE_NAME }}
        run: |
          TAG="${SHORT_SHA:0:12}"
          FULL_URI="${IMAGE_URI}:${TAG}"
          docker build -f .github/Dockerfile -t "$FULL_URI" -t "${IMAGE_URI}:latest" .
          docker push "$FULL_URI"
          docker push "${IMAGE_URI}:latest"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_uri=$FULL_URI" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 4. Build the manifest.json
      # ------------------------------------------------------------------
      - name: Build manifest
        id: manifest
        env:
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo || inputs.source_repo || 'manual' }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha || github.sha }}
        run: |
          cat > manifest.json <<EOF
          {
            "sourceRepo": "${SOURCE_REPO}",
            "commit":     "${SOURCE_SHA}",
            "runId":      "${{ github.run_id }}",
            "imageTag":   "${IMAGE_TAG}"
          }
          EOF
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 5. Create the sync bundle with the Dockerfile and manifest
      # ------------------------------------------------------------------
      - name: Assemble sync-bundle
        env:
          IMAGE_TAG: ${{ steps.manifest.outputs.image_tag }}
        run: |
          mkdir -p sync-bundle

          # The Dockerfile in the bundle only pulls the already built image:
          # the real build already happened in the previous step.
          cat > sync-bundle/Dockerfile <<EOF
          FROM ${{ secrets.IMAGE_REGISTRY }}/${{ secrets.IMAGE_NAME }}:${IMAGE_TAG}
          EOF

          cp manifest.json sync-bundle/manifest.json

      # ------------------------------------------------------------------
      # 6. Push del bundle su un branch sync/* di docker2azure4student
      # ------------------------------------------------------------------
      - name: Push sync bundle to infra repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_TAG: ${{ steps.manifest.outputs.image_tag }}
        run: |
          set -euo pipefail

          BRANCH="${SYNC_BRANCH_PREFIX}/${{ github.run_id }}-${IMAGE_TAG}"

          git clone \
            --depth 1 \
            --branch "${INFRA_REPO_DEFAULT_BRANCH}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${INFRA_REPO}.git" \
            infra-repo

          cd infra-repo
          git checkout -b "$BRANCH"

          # Copy the bundle (overwrites it if it exists from previous runs)
          cp -r ../sync-bundle ./sync-bundle

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add sync-bundle/
          git commit -m "chore: sync bundle from ${GITHUB_REPOSITORY}@${IMAGE_TAG} (run ${{ github.run_id }})"
          git push origin "$BRANCH"

          echo "Pushed sync bundle to ${INFRA_REPO}@${BRANCH}"
