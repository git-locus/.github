name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The page, endpoint or repository, and your browser or device if it is visual.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots or logs. Remove passwords, tokens and personal data first.
